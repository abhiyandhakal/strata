[package]
name = "strata"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arboard = "3.6"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
image = "0.25.10"
pulldown-cmark = "0.13.3"
ratatui-image = { version = "9.0.0", default-features = false, features = ["image-defaults", "crossterm"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
ratatui = "0.29"
resvg = "0.47.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
toml = "0.8"
tree-sitter = "0.25.8"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tui-textarea = "0.7"

[dev-dependencies]
assert_cmd = "2.1"
mockito = "1.7"
predicates = "3.1"
